name: Build ESP32 Libraries

on:
  push:
  workflow_dispatch:

jobs:
  build-libs:
    name: Build Libs for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s2, esp32s3, esp32c2, esp32c3, esp32c6, esp32h2, esp32p4, esp32p4_es, esp32c5, esp32c61]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache jq git wget curl libssl-dev libncurses-dev flex bison gperf python3-pip python3-serial python3-click python3-cryptography python3-future python3-pyparsing python3-pyelftools python3-venv libusb-1.0-0 libusb-1.0-0-dev libftdi1-2

      - name: Build Libs for ${{ matrix.target }}
        run: python3 run.py -t ${{ matrix.target }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: /tmp/myLibBuilder-repos/esp32-arduino-lib-builder/dist

  combine-artifacts:
    name: Combine artifacts
    needs: build-libs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true

      - name: Prepare esp32-arduino-libs archive
        id: prepare_archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -name 'arduino-esp32-libs-esp*.tar.gz' -exec tar zxvf {} -C out \;
          timestamp=$(date '+%Y%m%d-%H%M%S')
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          archive_name="${branch_name}_esp32-arduino-libs-${timestamp}.tar.gz"
          archive_path="dist/${archive_name}"
          (
            cd out/tools/esp32-arduino-libs
            tar -czf "../../../${archive_path}" .
          )
          cp out/package_esp32_index.template.json dist/package_esp32_index.template.json
          echo "archive_name=${archive_name}" >> "${GITHUB_OUTPUT}"
          echo "archive_path=${archive_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload full esp32-arduino-libs archive
        uses: actions/upload-artifact@v4
        with:
          name: esp32-arduino-libs
          path: ${{ steps.prepare_archive.outputs.archive_path }}

      - name: Upload package_esp32_index.template.json
        uses: actions/upload-artifact@v4
        with:
          name: package-esp32-index-json
          path: dist/package_esp32_index.template.json

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: builds
          files: |
            ${{ steps.prepare_archive.outputs.archive_path }}
            dist/package_esp32_index.template.json

  sync-assets:
    needs: combine-artifacts
    permissions:
      contents: write
    uses: ./.github/workflows/sync-assets.yml
    secrets:
      LIB_BUILDER_TOKEN: ${{ secrets.LIB_BUILDER_TOKEN }}
